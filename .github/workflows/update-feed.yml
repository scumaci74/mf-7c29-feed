name: Update Morning feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update feed
        env:
          SELF_URL: https://scumaci74.github.io/mf-7c29-feed/feed.xml
        run: python update_feed.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "Nessuna modifica al feed"
            exit 0
          fi
          git commit -m "Update Morning feed"
          git pull --rebase
          git push
